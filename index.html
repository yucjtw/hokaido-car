<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>北海道自駕工具</title>
    <style>
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: calc(16px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
      }
      h1 {
        margin: 0 0 4px;
        font-size: 1.25rem;
      }
      .hint {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 0.8125rem;
      }
      ul {
        display: grid;
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      a {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        color: var(--text);
        text-decoration: none;
      }
      img {
        width: 40px;
        height: 40px;
        flex: none;
      }
      b {
        display: block;
        font-size: 1.0625rem;
      }
      span {
        color: var(--muted);
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>北海道自駕工具</h1>
      <p class="hint">
        打開要用的頁面，再從 Safari 或 Chrome 選「加入主畫面」，每個頁面各自是一個 App。有網路時開過一次，之後沒網路也能開。
      </p>
      <ul>
        <li>
          <a href="./nav.html">
            <img src="./icon-nav-192.png" alt="" />
            <div><b>導航清單</b><span>各天景點的導航用 map code 與電話</span></div>
          </a>
        </li>
        <li>
          <a href="./paypay.html">
            <img src="./icon-paypay-192.png" alt="" />
            <div><b>PayPay 回饋</b><span>依實際回饋排序、記帳與額滿設定</span></div>
          </a>
        </li>
        <li>
          <a href="./cards.html">
            <img src="./icon-cards-192.png" alt="" />
            <div><b>信用卡回饋</b><span>日本實體刷卡該用哪張、記帳扣上限</span></div>
          </a>
        </li>
      </ul>
    </main>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
